name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/overrides/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/overrides/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Build documentation
        run: uv run --locked --only-group docs zensical build --strict
      - name: Check local links and assets
        run: uv run --locked --only-group docs python scripts/check_docs.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish documentation
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
