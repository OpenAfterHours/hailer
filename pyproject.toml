[project]
name = "hailer"
version = "0.2.8"
description = "Hailer: chat with your data. A conversational CLI that explores, analyses and charts local data files in a live marimo notebook."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenAfterHours" }]
keywords = ["marimo", "langchain", "polars", "duckdb", "data-analysis", "data-visualization", "cli"]
dependencies = [
    # Pinned: Hailer drives the private marimo._code_mode API and /api/kernel/execute.
    "marimo==0.24.2",
    # The agent loop (create_agent), the OpenAI-compatible chat model and the conversation
    # store (SQLite). Hailer passes base_url and use_responses_api explicitly and owns the HTTP
    # client; see hailer.agent.build_model before raising the upper bounds.
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # Excel reading via the Calamine engine (fastexcel), in local and Docker kernels.
    "polars[calamine]>=1.44",
    "duckdb>=1.5",
    "typer>=0.27",
    "rich>=15.0",
    # The inline chat composer: persistent input, bracketed paste, editing and history.
    "prompt-toolkit>=3.0.53,<4",
    # OS credential store (Windows Credential Manager on Windows) for API keys.
    "keyring>=25.6",
    # Checks for the cells the agent writes (hailer.code_checks): ruff lints them and, in the
    # kernel, formats them as code mode writes them; ty type-checks them. Both are pre-1.0 and
    # change their rules and messages between minor versions, so the ranges stay narrow.
    "ruff>=0.16.8,<0.17",
    "ty>=0.0.83,<0.0.84",
]

[project.scripts]
hailer = "hailer.cli:main"

[project.urls]
Repository = "https://github.com/openafterhours/hailer"
Documentation = "https://openafterhours.github.io/hailer/"

[dependency-groups]
docs = [
    "zensical==0.0.45",
]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
