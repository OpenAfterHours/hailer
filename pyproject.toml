[project]
name = "hailer"
version = "0.2.5"
description = "Hailer: chat with your data. A conversational CLI that explores, analyses and charts local data files in a live marimo notebook."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenAfterHours" }]
keywords = ["marimo", "langchain", "polars", "duckdb", "data-analysis", "data-visualization", "cli"]
dependencies = [
    # Pinned: Hailer drives the private marimo._code_mode API and /api/kernel/execute.
    "marimo==0.24.2",
    # The agent loop (create_agent), the OpenAI-compatible chat model and the conversation
    # store (SQLite). Hailer passes base_url and use_responses_api explicitly and owns the HTTP
    # client; see hailer.agent.build_model before raising the upper bounds.
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "polars>=1.44",
    "duckdb>=1.5",
    "typer>=0.27",
    "rich>=15.0",
    # The inline chat composer: persistent input, bracketed paste, editing and history.
    "prompt-toolkit>=3.0.53,<4",
    # OS credential store (Windows Credential Manager on Windows) for API keys.
    "keyring>=25.6",
]

[project.scripts]
hailer = "hailer.cli:main"

[project.urls]
Repository = "https://github.com/openafterhours/hailer"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
